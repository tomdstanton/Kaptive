[[repos]]
repo = "local"
hooks = [
  { id = "ruff-format", name = "ruff format", entry = "uv run --no-sync ruff format --force-exclude", language = "system", files = "^src/", types = ["python"], stages = ["pre-commit"], require_serial = true },
  { id = "ruff-check", name = "ruff check", entry = "uv run --no-sync ruff check --fix --force-exclude", language = "system", files = "^src/", types = ["python"], stages = ["pre-commit"], require_serial = true },
  { id = "ty-check", name = "ty check", entry = "uv run --no-sync ty check src/", language = "system", files = "^src/", types = ["python"], stages = ["pre-commit"], pass_filenames = false },
  { id = "zensical-check", name = "zensical check", entry = "uv run --no-sync zensical build --strict", language = "system", files = "^(docs/|zensical\\.toml$)", stages = ["pre-commit"], pass_filenames = false },
  { id = "pytest-fast", name = "pytest (fast offline)", entry = "uv run --no-sync pytest -n 0 --testmon", language = "system", files = "^(src/|tests/)", types = ["python"], stages = ["pre-commit"], pass_filenames = false },
]
