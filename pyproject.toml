[project]
name = "kaptive"
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
description = "The tool for _in silico_ serotyping"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4",
    "numba>=0.62",
    "rammappy>=0.1.3",
    "gb-io>=0.4",
]

[project.optional-dependencies]
plot = ["plotly"]
json = ["orjson"]
all = ["kaptive[plot,json]"]

[dependency-groups]
docs = [
    "kaptive[all]",
    "zensical",
    "mkdocstrings[python]",
    "deepl>=1.20",
]
test = [
    "kaptive[all]",
    "pytest",
    "pytest-testmon",
    "pytest-xdist",
    "pytest-cov",
]
typing = [
    "kaptive[all]",
    "ty",
]
lint = [
    "kaptive[all]",
    "ruff",
    "prek",
]
dev = [
    "kaptive[all]",
    { include-group = "docs" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[project.urls]
Homepage = "https://klebgenomics.github.io/Kaptive/"
Repository = "https://github.com/klebgenomics/Kaptive"
Documentation = "https://klebgenomics.github.io/Kaptive/"
"Bug Tracker" = "https://github.com/klebgenomics/Kaptive/issues"
Changelog = "https://github.com/klebgenomics/Kaptive/blob/master/CHANGELOG.md"

[project.scripts]
kaptive = "kaptive.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kaptive/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaptive"]

[tool.ruff]
line-length = 120
src = ["src"]
include = ["src/**/*.py", "src/**/*.pyi"]
exclude = ["src/kaptive/_version.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]
exclude = ["src/kaptive/_version.py"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "build", "scripts", ".github", ".git", ".ruff_cache"]
addopts = "-q --tb=short --show-capture=no -n auto --dist loadfile"
