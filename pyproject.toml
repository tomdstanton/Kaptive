[project]
name = "kaptive"
authors = [
    {name="Tom Stanton", email="tomdstanton@gmail.com" },
]
description = "In silico serotyping"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "edlib"]
dynamic = ["version"]
keywords = ["bioinformatics", "serotyping", "microbiology", "genomics"]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[project.scripts]
eris = "kaptive.cli:main"

[project.optional-dependencies]
meta = ["scikit-learn"]
test = ["pytest"]
docs = ["mkdocs-material", "mkdocs-api-autonav>=0.3.0,<0.4"]
dev = ["kaptive[test,docs,meta]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

